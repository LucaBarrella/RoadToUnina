name: RoadToUnina CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # --- 1. Backend Build, Lint & Automated Tests ---
  backend-test:
    name: ⚙️ Backend CI & Unit/Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: roadtounina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: 📦 Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: ⚡ Generate Prisma Client & Run Migrations
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/roadtounina_test?schema=public"
          DIRECT_URL: "postgresql://postgres:postgrespassword@localhost:5432/roadtounina_test?schema=public"
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss
          npx prisma db seed

      - name: 🔨 Compile TypeScript
        working-directory: backend
        run: npm run build

      - name: 🧪 Run Backend Vitest Suite (53 Tests)
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/roadtounina_test?schema=public"
          DIRECT_URL: "postgresql://postgres:postgrespassword@localhost:5432/roadtounina_test?schema=public"
          JWT_SECRET: "ci_test_jwt_secret_roadtounina_2026"
          PORT: 3001
          NODE_ENV: test
        run: npm test

  # --- 2. Frontend Build & Typecheck ---
  frontend-build:
    name: 🖥️ Frontend CI & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: 📦 Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: 🔨 Typecheck & Build Vite SPA
        working-directory: frontend
        run: npm run build

  # --- 3. End-to-End Playwright Automated Playtests ---
  e2e-playtests:
    name: 🎭 Playwright E2E Playtests
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: roadtounina_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Backend & Frontend Dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: 🎭 Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: ⚡ Setup Database & Seed
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/roadtounina_e2e?schema=public"
          DIRECT_URL: "postgresql://postgres:postgrespassword@localhost:5432/roadtounina_e2e?schema=public"
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss
          npx prisma db seed

      - name: 🚀 Start Backend API Server
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/roadtounina_e2e?schema=public"
          DIRECT_URL: "postgresql://postgres:postgrespassword@localhost:5432/roadtounina_e2e?schema=public"
          JWT_SECRET: "e2e_test_jwt_secret_roadtounina_2026"
          PORT: 3001
          NODE_ENV: test
          ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
        run: npm run dev &

      - name: 🚀 Start Frontend Development Server
        working-directory: frontend
        env:
          VITE_API_BASE_URL: "http://localhost:3001/api"
        run: npm run dev &

      - name: ⏳ Wait for Servers to be Ready
        run: |
          npx wait-on http://localhost:3001/api/public/leaderboard -t 30000
          npx wait-on http://localhost:5173 -t 30000

      - name: 🎮 Execute Playwright E2E Suite
        working-directory: frontend
        run: npx playwright test
